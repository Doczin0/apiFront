<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Curso</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Editar Curso</h1>

    <!-- O th:action aponta para a rota de atualizar passando o ID do curso -->
    <form th:action="@{/cursos/atualizar/{id}(id=${curso.id})}" th:object="${curso}" method="POST" class="space-y-4">

        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">Nome do Curso:</label>
            <input type="text" th:field="*{name}" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">Categoria:</label>
            <input type="text" th:field="*{category}" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">Professor:</label>
            <input type="text" th:field="*{professor}" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="flex justify-between items-center mt-6">
            <a th:href="@{/cursos/{id}(id=${curso.id})}" class="text-gray-600 hover:underline text-sm">Cancelar</a>
            <button type="submit"
                    class="bg-yellow-500 text-white px-4 py-2 rounded-md hover:bg-yellow-600 font-semibold transition duration-200">
                Salvar Alterações
            </button>
        </div>

    </form>
</div>

</body>
</html>
