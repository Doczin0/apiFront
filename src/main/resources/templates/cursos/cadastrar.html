<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar novo curso</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-gray-100 font-sans min-h-screen flex items-center justify-center p-4">

<div class="bg-zinc-900 border border-zinc-800 p-8 rounded-xl shadow-2xl w-full max-w-md">
    <h1 class="text-3xl font-bold text-violet-500 mb-6 text-center">Cursos</h1>

    <form th:action="@{/cursos/salvar}" th:object="${curso}" method="POST" class="space-y-4">

        <div>
            <label class="block text-zinc-400 text-xs uppercase font-bold mb-1">Nome</label>
            <input type="text" th:field="*{name}" required
                   class="w-full px-3 py-2 bg-zinc-950 border border-zinc-800 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-violet-600">
        </div>

        <div>
            <label class="block text-zinc-400 text-xs uppercase font-bold mb-1">Categoria</label>
            <input type="text" th:field="*{category}" required
                   class="w-full px-3 py-2 bg-zinc-950 border border-zinc-800 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-violet-600">
        </div>

        <div>
            <label class="block text-zinc-400 text-xs uppercase font-bold mb-1">Professor(a)</label>
            <input type="text" th:field="*{professor}" required
                   class="w-full px-3 py-2 bg-zinc-950 border border-zinc-800 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-violet-600">
        </div>

        <!-- Campo Ativo Corrigido para o Thymeleaf -->
        <div class="flex items-center space-x-2 pt-2">
            <input type="checkbox" th:field="*{active}" id="active"
                   class="w-4 h-4 text-violet-600 bg-zinc-950 border-zinc-800 rounded focus:ring-violet-600">
            <label for="active" class="text-zinc-400 text-xs uppercase font-bold cursor-pointer">Ativo</label>
        </div>

        <div class="flex justify-between items-center pt-4">
            <a th:href="@{/cursos}" class="text-zinc-400 hover:text-white text-sm">Voltar</a>
            <button type="submit"
                    class="bg-violet-600 hover:bg-violet-700 text-white px-6 py-2 rounded-md font-semibold transition duration-200 shadow">
                Cadastrar
            </button>
        </div>

    </form>
</div>

</body>
</html>
